<!DOCTYPE html>
<!--
  CURLY HEAD DOODLE — GENERIC CUSTOM PAGE TEMPLATE
  ==========================================
  One shared file for every custom section added in admin.html (under
  "Strony niestandardowe"). Which page shows is decided entirely by the
  ?slug=... query string — script.js's applyCustomPage() looks up that
  slug in data/content.json's customPages array and renders its heading
  + content blocks (same heading/font/photo/collage/bullets system used
  by O nas / O rasie / Szczenięta). Don't edit this file to add a page —
  add it from admin.html instead, so it also gets a real nav link.
-->
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curly Head Doodle</title>
<meta name="description" content="Curly Head Doodle — hodowla Mini Goldendoodle w Mielcu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip-link" href="#main">Przejdź do treści</a>

<header class="site-header" id="siteHeader">
  <div class="wrap header-row">
    <a class="wordmark" href="index.html">
      <span class="brand-mark-slot" data-logo-slot="logo" aria-hidden="true">
        <svg class="brand-mark" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="30" fill="none" stroke="var(--color-gold)" stroke-width="1.4" stroke-dasharray="2 3"/>
          <path d="M32 14 C34 10 40 10 40 15 C40 18 36 19 35 22" fill="none" stroke="var(--color-gold)" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M20 30 C18 24 22 19 27 20 C24 23 25 27 28 28" fill="none" stroke="var(--color-ink)" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M44 30 C46 24 42 19 37 20 C40 23 39 27 36 28" fill="none" stroke="var(--color-ink)" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="32" cy="35" r="12" fill="none" stroke="var(--color-ink)" stroke-width="1.8"/>
          <path d="M25 32 C26 30 28 30 28 32 C28 34 26 34 25 32Z" fill="var(--color-ink)"/>
          <path d="M39 32 C38 30 36 30 36 32 C36 34 38 34 39 32Z" fill="var(--color-ink)"/>
          <ellipse cx="32" cy="39" rx="2.4" ry="1.8" fill="var(--color-ink)"/>
        </svg>
      </span>
      <span class="wordmark-text" id="brandName">Curly Head Doodle</span>
    </a>

    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="primaryNav">
      <span></span><span></span><span></span>
      <span class="sr-only">Menu</span>
    </button>

    <nav class="primary-nav" id="primaryNav">
      <a href="o-nas.html" data-i18n="nav_about" data-section="about">O nas</a>
      <a href="o-rasie.html" data-i18n="nav_breed" data-section="breed">O rasie</a>
      <a href="nasze-psy.html" data-i18n="nav_dogs" data-section="dogs">Nasze psy</a>
      <a href="szczenieta.html" data-i18n="nav_puppies" data-section="litters">Szczenięta</a>
      <a href="kontakt.html" class="nav-cta" data-i18n="nav_cta">Wypełnij ankietę</a>
      <div class="lang-switch" role="group" aria-label="Language / Język">
        <button type="button" class="lang-btn" data-lang="pl">PL</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
    </nav>
  </div>
</header>

<main id="main">
  <section class="section">
    <div class="wrap">
      <!-- Filled in by script.js's applyCustomPage() from the customPages
           entry matching ?slug=... in the URL. -->
      <h1 id="customPageHeading"></h1>
      <div id="customPageBody"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-row">
    <div>
      <p class="wordmark small" id="brandNameFooter">Curly Head Doodle</p>
      <p class="muted" data-i18n="contact_location_value">Mielec</p>
    </div>
    <div class="footer-right">
      <p class="muted" data-i18n="footer_disclaimer">Nie prowadzimy sprzedaży za pośrednictwem portali ogłoszeniowych typu OLX.</p>
      <p class="muted" data-i18n="footer_copyright">&copy; 2026 Curly Head Doodle. Wszelkie prawa zastrzeżone.</p>
      <p class="muted footer-links"><a class="admin-link" href="privacy.html">Polityka prywatności</a> · <a class="admin-link" href="admin.html">Ustawienia strony</a></p>
    </div>
  </div>
</footer>

<!-- Needed here because a paragraph's photo placeholder (before upload) uses <use href="#icon-paw">. -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="icon-paw" viewBox="0 0 24 24">
      <circle cx="12" cy="15.5" r="5"/>
      <circle cx="4.5" cy="9" r="2.4"/>
      <circle cx="10" cy="4.8" r="2.4"/>
      <circle cx="14" cy="4.8" r="2.4"/>
      <circle cx="19.5" cy="9" r="2.4"/>
    </symbol>
  </defs>
</svg>

<script src="script.js"></script>
</body>
</html>
